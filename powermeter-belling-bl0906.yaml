substitutions:
  devicename: powermeter-belling-bl0906
  location_id: livingroom

esphome:
  name: $devicename

esp32:
  variant: esp32
  flash_size: 8MB

<<: !include common/base.yaml

logger:
  level: DEBUG
  # Separate ESP32 dev board: UART0/USB stays free for serial logs.

# BL0906 is wired to the dev board's free pins:
#   ESP32 GPIO26 (TX) -> BL0906 RX (H1.3)
#   ESP32 GPIO25 (RX) <- BL0906 TX (H1.4)
# Do NOT use GPIO1/3: they are UART0 and are driven by the dev board's
# onboard USB-UART bridge, which blocks the BL0906's TX.
uart:
  id: uart_bus
  tx_pin: GPIO26
  rx_pin: GPIO25
  baud_rate: 19200
  stop_bits: 1

# Example configuration entry
sensor:
  - platform: bl0906
    uart_id: uart_bus
    frequency:
      name: 'Frequency'
    temperature:
      name: 'Temperature'
    voltage:
      name: 'Voltage'
    channel_1:
      current:
        name: 'Current_1'
      power:
        name: 'Power_1'
      energy:
        name: 'Energy_1'
    channel_2:
      current:
        name: 'Current_2'
      power:
        name: 'Power_2'
      energy:
        name: 'Energy_2'
    channel_3:
      current:
        name: 'Current_3'
      power:
        name: 'Power_3'
      energy:
        name: 'Energy_3'
    channel_4:
      current:
        name: 'Current_4'
      power:
        name: 'Power_4'
      energy:
        name: 'Energy_4'
    channel_5:
      current:
        name: 'Current_5'
      power:
        name: 'Power_5'
      energy:
        name: 'Energy_5'
    channel_6:
      current:
        name: 'Current_6'
      power:
        name: 'Power_6'
      energy:
        name: 'Energy_6'
    total_energy:
      name: 'Total_Energy'
    total_power:
      name: 'Total_Power'
